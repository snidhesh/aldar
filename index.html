<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Doors Open | The Aldar open house by BlackOak Real Estate</title>
<meta name="description" content="One open house for every Aldar community in Abu Dhabi and Dubai. 12.12.2026 at Aldar Sales Center Dubai, organised by BlackOak Real Estate.">
<meta name="theme-color" content="#000000">
<meta property="og:type" content="website">
<meta property="og:title" content="All Doors Open: one door, every address">
<meta property="og:description" content="One open house for every Aldar community in Abu Dhabi and Dubai. 12.12.2026 at Aldar Sales Center Dubai, organised by BlackOak Real Estate.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F0F1EF'/%3E%3Cpath d='M9 28V13a7 7 0 0 1 14 0v15z' fill='%23000'/%3E%3Ccircle cx='19.5' cy='19' r='1.6' fill='%23D6AC65'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&amp;family=Jost:wght@300..600&amp;display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app"></div>
<noscript><p style="margin: 0; padding: 24px; background: #FFFFFF; color: #000000; font-family: system-ui, sans-serif">All Doors Open, the Aldar open house organised by BlackOak Real Estate, needs JavaScript to display.</p></noscript>
<template id="dc">
<div style="--sun: {{accent}}">
<div id="top" style="background: var(--mist); color: var(--ink); font-family: var(--font-body); font-size: 18px; line-height: 1.55; overflow-x: clip">


<main>

<sc-if value="{{ isHome }}">
<section style="display: grid; align-items: center; min-height: 100svh">
<div style="width: 100%; max-width: 1280px; margin: 0 auto; padding: 64px 32px 80px; display: flex; flex-wrap: wrap; align-items: center; gap: 48px">
<div style="flex: 1.3 1 520px; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 28px">
<p class="eyebrow rise" style="display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--graphite)"><span>The Aldar open house</span><span aria-hidden="true">/</span><span>{{eventDate}}</span><sc-if value="{{ hasVenue }}"><span aria-hidden="true">/</span><span>{{venue}}</span></sc-if></p>
<h1 class="display rise rise-2" style="margin: 0; font-size: clamp(50px, 6.6vw, 96px); font-weight: 500; line-height: 0.96; letter-spacing: -0.02em; color: var(--ink)">One door.<br><em style="font-style: italic; color: var(--pewter)">Every</em> address.</h1>
</div>
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 12px">
<div class="stage" onMouseMove="{{ heroMove }}" onMouseLeave="{{ heroLeave }}">
<span class="deco-moon drift-a" aria-hidden="true"></span>
<svg class="deco-squiggle drift-c" viewBox="0 0 120 24" aria-hidden="true"><path d="M3 12 Q 12.5 0 22 12 T 41 12 T 60 12 T 79 12 T 98 12 T 117 12" style="fill: none; stroke: var(--sky); stroke-width: 3; stroke-linecap: round"></path></svg>
<span class="deco-column" aria-hidden="true"><span class="deco-orb"></span></span>
<span class="floor" aria-hidden="true"></span>
<div class="arch-frame">
<div class="arch">
<div class="vista" aria-hidden="true">
<span class="vista-sun drift-b"></span>
<span class="vista-arcade"><span></span><span></span><span></span><span></span><span></span></span>
<span class="vista-sea"></span>
<span class="vista-deep"></span>
</div>
<button type="button" id="hero-door" class="leaf {{ doorCls }}" onClick="{{ toggleDoor }}" aria-label="{{ doorLabel }}">
<span class="leaf-top" aria-hidden="true"></span>
<span class="leaf-mid" aria-hidden="true"></span>
<span class="leaf-low" aria-hidden="true"></span>
<span class="leaf-knob" aria-hidden="true"></span>
<span class="leaf-word" aria-hidden="true">Push</span>
</button>
</div>
</div>
</div>
<button type="button" id="hero-door-toggle" class="textbtn" onClick="{{ toggleDoor }}">{{ doorLabel }}</button>
</div>
</div>
</section>

</sc-if>

<sc-if value="{{ isHouse }}">
<section id="house" style="display: grid; align-items: center; min-height: 100svh; background: var(--white)">
<div style="width: 100%; max-width: 1280px; margin: 0 auto; padding: 88px 32px 104px; display: flex; flex-direction: column; gap: 44px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px 64px">
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<p class="eyebrow" style="color: var(--graphite)">The walkthrough</p>
<h2 class="display" style="margin: 0; font-size: clamp(42px, 5.2vw, 76px); font-weight: 500; line-height: 1; letter-spacing: -0.015em">Five areas. <em style="font-style: italic; color: var(--pewter)">One open house.</em></h2>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px">
<span class="eyebrow" style="margin-right: 8px; color: var(--graphite)">I'm drawn to</span>
<sc-for list="{{ filters }}" as="f"><button type="button" id="filter-{{ f.id }}" class="chip {{ f.cls }}" onClick="{{ f.pick }}" aria-pressed="{{ f.on }}">{{ f.label }}</button></sc-for>
</div>

<div class="doors" style="padding-top: 8px">
<sc-for list="{{ rooms }}" as="room">
<a id="door-{{ room.id }}" class="door {{ room.cls }}" href="{{ room.href }}" aria-label="{{ room.label }}">
<span class="door-arch">
<span class="scene {{ room.sceneCls }}"><span class="sa"></span><span class="sb"></span><span class="sc"></span></span>
<span class="door-leaf"><span class="door-no display">{{ room.no }}</span><span class="door-knob"></span></span>
</span>
<span class="door-step"></span>
<span class="door-name display">{{ room.name }}</span>
<span class="door-badge">On your visit</span>
</a>
</sc-for>
</div>
</div>
</section>

</sc-if>

<sc-if value="{{ isRoom }}">
<div class="modal" role="dialog" aria-modal="true" aria-label="{{ room.name }}">
<div class="modal-sheet">
<div class="modal-bar"><a id="modal-close" class="modal-close" href="#house" aria-label="Close"><span aria-hidden="true">&times;</span></a></div>
<section style="background: var(--white)">
<div class="panel {{ swapCls }}" style="max-width: 1280px; margin: 0 auto; padding: 36px 32px 96px; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px">
<span class="eyebrow" style="color: var(--graphite)">{{ room.count }}</span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 48px 72px">
<div style="flex: 1.3 1 480px; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 22px">
<p class="eyebrow" style="color: var(--graphite)">{{ room.region }}</p>
<h1 class="display" style="margin: 0; font-size: clamp(54px, 7vw, 104px); font-style: italic; font-weight: 500; line-height: 0.98; letter-spacing: -0.02em">{{ room.name }}</h1>
<p style="margin: 0; max-width: 560px; font-size: 21px; line-height: 1.55; color: var(--graphite)">{{ room.blurb }}</p>
<div style="display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px">
<button type="button" id="room-pick" class="btn btn-primary {{ room.pickCls }}" onClick="{{ room.toggle }}" aria-pressed="{{ room.picked }}">{{ room.pickLabel }}</button>
<a class="btn btn-ghost" href="#register">Register interest</a>
</div>
</div>
<div style="flex: 1 1 320px; min-width: 0; display: flex; justify-content: center; padding: 14px">
<div class="room-arch" aria-hidden="true"><span class="scene {{ room.sceneCls }}"><span class="sa"></span><span class="sb"></span><span class="sc"></span></span></div>
</div>
</div>
</div>
</section>

<section style="background: var(--mist)">
<div style="max-width: 1280px; margin: 0 auto; padding: 88px 32px 96px; display: flex; flex-direction: column; gap: 64px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 48px 72px">
<div style="flex: 1.3 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<h2 class="eyebrow" style="color: var(--graphite)">Communities here</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{ room.homes }}" as="home"><li class="tag"><span>{{ home.n }}</span><sc-if value="{{ home.isNew }}"><span class="tag-new">New in 2026</span></sc-if></li></sc-for>
</ul>
</div>
<sc-if value="{{ room.hasFacts }}">
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<h2 class="eyebrow" style="color: var(--graphite)">Worth knowing</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); gap: 20px 32px">
<sc-for list="{{ room.facts }}" as="fact"><div style="display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 1.5px solid var(--ink)"><span class="display" style="font-size: 46px; font-weight: 500; line-height: 1; color: var(--ink)">{{ fact.fig }}</span><span style="font-size: 16px; line-height: 1.45; color: var(--graphite)">{{ fact.lab }}</span></div></sc-for>
</div>
</div>
</sc-if>
</div>

<div style="display: flex; flex-direction: column; gap: 18px">
<h2 class="eyebrow" style="color: var(--graphite)">A look inside</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 20px">
<div class="slot">[COMMUNITY IMAGE]</div>
<div class="slot">[COMMUNITY IMAGE]</div>
<div class="slot">[MASTERPLAN OR MODEL IMAGE]</div>
</div>
</div>

<p style="margin: 0; font-size: 14px; line-height: 1.5; color: var(--graphite)">Working list, drawn from public listings and news coverage. The final line-up is for Aldar to confirm.</p>
</div>
</section>
<section style="background: var(--stone); color: var(--ink)">
<div style="max-width: 1280px; margin: 0 auto; padding: 80px 32px 88px; display: flex; flex-direction: column; gap: 40px">
<h2 class="display" style="margin: 0; font-size: clamp(34px, 3.6vw, 52px); font-weight: 500; line-height: 1.05; letter-spacing: -0.015em">Other <em style="font-style: italic">areas.</em></h2>
<div class="doors">
<sc-for list="{{ others }}" as="o">
<a id="other-{{ o.id }}" class="door {{ o.cls }}" href="{{ o.href }}" aria-label="{{ o.label }}">
<span class="door-arch">
<span class="scene {{ o.sceneCls }}"><span class="sa"></span><span class="sb"></span><span class="sc"></span></span>
<span class="door-leaf"><span class="door-no display">{{ o.no }}</span><span class="door-knob"></span></span>
</span>
<span class="door-step"></span>
<span class="door-name display">{{ o.name }}</span>
<span class="door-badge">On your visit</span>
</a>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px 40px; padding-top: 8px">
<a class="textlink" href="#event">Continue to the event</a>
<a class="textlink" href="#register">Register interest</a>
</div>
</div>
</section>
</div>
</div>
</sc-if>

<sc-if value="{{ isRegister }}">
<section style="background: var(--mist)">
<div style="max-width: 1280px; margin: 0 auto; padding: 88px 32px 104px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 56px 72px">
<div style="flex: 1.25 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-direction: column; gap: 16px">
<p class="eyebrow" style="color: var(--graphite)">Register your interest</p>
<h1 class="display" style="margin: 0; font-size: clamp(42px, 5.2vw, 76px); font-weight: 500; line-height: 1; letter-spacing: -0.015em">Have your <em style="font-style: italic; color: var(--pewter)">key.</em></h1>
<p style="margin: 0; max-width: 540px; color: var(--graphite)">Tell us who is coming and which areas you would like to see. We will hold a place and send you the details.</p>
</div>

<sc-if value="{{ notSent }}">
<form onSubmit="{{ submit }}" novalidate="novalidate" style="display: flex; flex-direction: column; gap: 30px">
<div class="field">
<label class="label" for="f-name">Full name</label>
<input class="input {{ nameCls }}" id="f-name" name="name" type="text" autocomplete="name" value="{{ fName }}" onChange="{{ onName }}">
<sc-if value="{{ errName }}"><span class="err">Please tell us your name.</span></sc-if>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 30px 24px">
<div class="field">
<label class="label" for="f-email">Email</label>
<input class="input {{ emailCls }}" id="f-email" name="email" type="text" inputmode="email" autocomplete="email" value="{{ fEmail }}" onChange="{{ onEmail }}">
<sc-if value="{{ errEmail }}"><span class="err">That email address looks incomplete.</span></sc-if>
</div>
<div class="field">
<label class="label" for="f-phone">Mobile, with country code</label>
<input class="input {{ phoneCls }}" id="f-phone" name="phone" type="tel" autocomplete="tel" value="{{ fPhone }}" onChange="{{ onPhone }}">
<sc-if value="{{ errPhone }}"><span class="err">Please add a number we can reach you on.</span></sc-if>
</div>
</div>
<div class="field" role="group" aria-labelledby="l-role">
<span class="label" id="l-role">I'm coming as</span>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{ roles }}" as="o"><button type="button" id="{{ o.id }}" class="opt {{ o.cls }}" onClick="{{ o.pick }}" aria-pressed="{{ o.on }}">{{ o.label }}</button></sc-for>
</div>
</div>
<div class="field" role="group" aria-labelledby="l-rooms">
<span class="label" id="l-rooms">Areas I'm interested in</span>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{ rooms }}" as="room"><button type="button" id="pick-{{ room.id }}" class="opt {{ room.optCls }}" onClick="{{ room.toggle }}" aria-pressed="{{ room.picked }}">{{ room.name }}</button></sc-for>
</div>
<span style="font-size: 15px; color: var(--graphite)">Leave these blank and we will plan for all five.</span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 30px 24px">
<div class="field" role="group" aria-labelledby="l-guests">
<span class="label" id="l-guests">Guests</span>
<div class="count">
<button type="button" id="guests-fewer" onClick="{{ fewer }}" aria-label="One guest fewer">−</button>
<span aria-live="polite">{{ guests }}</span>
<button type="button" id="guests-more" onClick="{{ more }}" aria-label="One guest more">+</button>
</div>
</div>
<div class="field" role="group" aria-labelledby="l-time">
<span class="label" id="l-time">I'd rather arrive in the</span>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{ times }}" as="o"><button type="button" id="{{ o.id }}" class="opt {{ o.cls }}" onClick="{{ o.pick }}" aria-pressed="{{ o.on }}">{{ o.label }}</button></sc-for>
</div>
</div>
</div>
<div class="field">
<label class="check" for="f-consent"><input id="f-consent" name="consent" type="checkbox" checked="{{ consent }}" onChange="{{ onConsent }}"><span>I agree to be contacted about this open house by {{organiser}}.</span></label>
<sc-if value="{{ errConsent }}"><span class="err">Please tick the box so we can send you the details.</span></sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px">
<button type="submit" id="f-submit" class="btn btn-primary">Register my interest</button>
<span style="flex: 1 1 240px; font-size: 15px; line-height: 1.45; color: var(--graphite)">Preview mode: nothing you type here is sent or stored.</span>
</div>
</form>
</sc-if>

<sc-if value="{{ sent }}">
<div role="status" style="display: flex; flex-direction: column; align-items: flex-start; gap: 18px; padding: 40px; border: 1.5px solid var(--ink); background: var(--white)">
<p class="eyebrow" style="color: var(--graphite)">Key ready</p>
<h2 class="display" style="margin: 0; font-size: clamp(34px, 3.4vw, 46px); font-style: italic; font-weight: 500; line-height: 1.05">Thank you, {{ firstName }}.</h2>
<p style="margin: 0; max-width: 520px; color: var(--graphite)">On the live page your place would now be held and a confirmation sent to {{ fEmail }}. This is a preview, so nothing has been sent or stored.</p>
<div style="display: flex; flex-wrap: wrap; gap: 14px">
<a class="btn btn-primary" href="#event">See the event details</a>
<button type="button" id="f-edit" class="btn btn-ghost" onClick="{{ edit }}">Change my details</button>
</div>
</div>
</sc-if>
</div>

<aside aria-label="Your guest key" style="flex: 1 1 340px; min-width: 0; position: sticky; top: 40px; padding: 0 10px 10px 0">
<div class="keycard {{ keyCls }}">
<span class="key-hole" aria-hidden="true"></span>
<p style="margin: 0; text-align: center; font-size: 12px; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: var(--stone)">{{ keyStatus }}</p>
<p class="display" style="margin: 0; text-align: center; font-size: 40px; font-style: italic; font-weight: 500; line-height: 1.05; overflow-wrap: anywhere">{{ keyName }}</p>
<div class="key-row"><span class="key-k">Areas</span><span class="key-v">{{ keyRooms }}</span></div>
<div class="key-row"><span class="key-k">When</span><span class="key-v">{{eventDate}}, {{ keyTime }}</span></div>
<sc-if value="{{ hasVenue }}"><div class="key-row"><span class="key-k">Where</span><span class="key-v">{{venue}}</span></div></sc-if>
<div class="key-row"><span class="key-k">Party</span><span class="key-v">{{ keyParty }}</span></div>
<p class="display" style="margin: 6px 0 0; padding-top: 16px; border-top: 1px dashed var(--pewter); text-align: center; font-size: 20px; font-weight: 500; line-height: 1.2">All Doors Open</p>
</div>
</aside>
</div>
</section>
</sc-if>

<sc-if value="{{ isEvent }}">
<section style="background: var(--white)">
<div style="max-width: 1280px; margin: 0 auto; padding: 88px 32px 96px; display: flex; flex-direction: column; gap: 56px">
<div style="display: flex; flex-direction: column; gap: 16px">
<p class="eyebrow" style="color: var(--graphite)">The event</p>
<h1 class="display" style="margin: 0; font-size: clamp(48px, 6vw, 88px); font-weight: 500; line-height: 1; letter-spacing: -0.015em">When and <em style="font-style: italic; color: var(--pewter)">where.</em></h1>
<p style="margin: 0; max-width: 560px; font-size: 20px; color: var(--graphite)">One open house for every Aldar community in Abu Dhabi and Dubai. Come when it suits you and take each area at your own pace.</p>
</div>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 0 48px">
<div class="detail"><dt class="detail-k">Date</dt><dd class="detail-v display">{{eventDate}}</dd></div>
<div class="detail"><dt class="detail-k">Venue</dt><dd class="detail-v display">{{ venueText }}</dd></div>
<div class="detail"><dt class="detail-k">Hours</dt><dd class="detail-v display">[EVENT HOURS]</dd></div>
<div class="detail"><dt class="detail-k">Address</dt><dd class="detail-v display">[VENUE ADDRESS]</dd></div>
<div class="detail"><dt class="detail-k">Getting there</dt><dd class="detail-v display">[PARKING AND ARRIVAL NOTES]</dd></div>
<div class="detail"><dt class="detail-k">Directions</dt><dd class="detail-v display">[MAP LINK]</dd></div>
</dl>
</div>
</section>

<section class="dark" style="background: var(--ink); color: var(--white)">
<div style="max-width: 1280px; margin: 0 auto; padding: 88px 32px 96px; display: flex; flex-direction: column; gap: 44px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 64px">
<h2 class="display" style="flex: 1 1 520px; margin: 0; font-size: clamp(38px, 4.4vw, 64px); font-weight: 500; line-height: 1.02; letter-spacing: -0.015em">How the visit <em style="font-style: italic; color: var(--sky)">works.</em></h2>
<p style="margin: 0; font-size: 14px; color: var(--stone)">Proposed format, to be confirmed.</p>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 32px 40px">
<li class="visit-step"><span class="visit-no display">01</span><h3 class="visit-title display">Arrive</h3><p class="visit-body">Your guest key is waiting at the door, printed with the areas you chose when you registered.</p></li>
<li class="visit-step"><span class="visit-no display">02</span><h3 class="visit-title display">Walk the areas</h3><p class="visit-body">Each area has its own display of masterplans and models, so an island and a garden suburb can be weighed side by side.</p></li>
<li class="visit-step"><span class="visit-no display">03</span><h3 class="visit-title display">Talk it through</h3><p class="visit-body">Sit down with an advisor for an unhurried, private conversation about homes, availability and what comes next.</p></li>
</ol>
</div>
</section>

</sc-if>

<sc-if value="{{ isOrganiser }}">
<section style="background: var(--white)">
<div style="max-width: 1280px; margin: 0 auto; padding: 88px 32px 96px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 56px 72px">
<div style="flex: 1.3 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<p class="eyebrow" style="color: var(--graphite)">Organised by</p>
<h1 class="display" style="margin: 0; font-size: clamp(46px, 5.6vw, 84px); font-weight: 500; line-height: 1; letter-spacing: -0.015em">{{organiser}}</h1>
<p style="margin: 0; max-width: 580px; font-size: 20px; color: var(--graphite)">A luxury real estate firm with offices in Dubai and London. Its work covers four areas.</p>
<ul style="list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 0 40px">
<li class="detail"><span class="detail-v display">Brokerage</span></li>
<li class="detail"><span class="detail-v display">Investments</span></li>
<li class="detail"><span class="detail-v display">Real estate and development advisory</span></li>
<li class="detail"><span class="detail-v display">Portfolio and asset management</span></li>
</ul>
</div>
<div style="flex: 1 1 340px; min-width: 0; padding: 40px; border: 1.5px solid var(--ink); background: var(--mist); display: flex; flex-direction: column; gap: 26px">
<h2 class="eyebrow" style="color: var(--graphite)">Contact</h2>
<div style="display: flex; flex-direction: column; gap: 4px"><span class="label">Email</span><span style="font-size: 20px; overflow-wrap: anywhere">info@blackoak-re.com</span></div>
<div style="display: flex; flex-direction: column; gap: 4px"><span class="label">Phone</span><span style="font-size: 20px">+971 4 398 9055</span></div>
<div style="display: flex; flex-direction: column; gap: 4px"><span class="label">Dubai office</span><span style="font-size: 18px">Marina Plaza, Office 1406, Dubai Marina, Dubai, UAE</span></div>
<div style="display: flex; flex-direction: column; gap: 4px"><span class="label">London office</span><span style="font-size: 18px">71-75 Shelton Street, London WC2H 9JQ, United Kingdom</span></div>
<div style="display: flex; flex-direction: column; gap: 4px"><span class="label">Website</span><a href="https://www.blackoak-re.com/" style="font-size: 18px; overflow-wrap: anywhere">blackoak-re.com</a></div>
</div>
</div>
</section>

<section style="background: var(--mist)">
<div style="max-width: 1280px; margin: 0 auto; padding: 72px 32px 88px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px 64px">
<p style="flex: 1 1 480px; max-width: 640px; margin: 0; color: var(--graphite)">This open house is organised by {{organiser}} and presents communities developed by Aldar. It is not an official Aldar website.</p>
</div>
</section>
</sc-if>

<sc-if value="{{ hasNext }}">
<section style="background: var(--stone); color: var(--ink)">
<div class="nextdoor" style="max-width: 1280px; margin: 0 auto; padding: 80px 32px 88px; display: flex; flex-direction: column; align-items: center; gap: 30px; text-align: center">
<p class="eyebrow" style="color: var(--graphite)">{{ next.kicker }}</p>
<a id="next-door" class="door {{ next.cls }}" href="{{ next.href }}" aria-label="{{ next.label }}">
<span class="door-arch">
<span class="scene {{ next.sceneCls }}"><span class="sa"></span><span class="sb"></span><span class="sc"></span></span>
<span class="door-leaf"><span class="door-no display">{{ next.no }}</span><span class="door-knob"></span></span>
</span>
<span class="door-step"></span>
<span class="door-name display">{{ next.name }}</span>
<span class="door-place">{{ next.place }}</span>
<span class="door-cue">Open the door</span>
</a>
</div>
</section>
</sc-if>

</main>


</div>
</div>
</template>
<script src="js/app.js"></script>
</body>
</html>
