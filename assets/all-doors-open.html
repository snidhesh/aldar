<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Doors Open</title>
<meta name="description" content="Concept site for an open house of Aldar communities in Abu Dhabi and Dubai, organised by BlackOak Real Estate.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&amp;family=Jost:wght@300..600&amp;display=swap">
<style>
:root{
/* Layout: fluid sections on a 1280px measure, one page per #name. Black-and-white base with stone greys; sky blue and tan as the only accents. */
color-scheme:light;
--ink:#000000;--graphite:#515150;--pewter:#808282;--stone:#D7D1CA;--mist:#F0F1EF;--white:#FFFFFF;
--sky:#769CD2;--lagoon:#7AC9D4;--sun:#D6AC65;--alert:#B3261E;--alert-wash:#FDF1F0;
--font-display:'Bodoni Moda',Didot,'Bodoni 72',Georgia,serif;
--font-body:Jost,'Century Gothic','Avenir Next',system-ui,sans-serif;
}
h1,h2,h3{text-wrap:balance}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink)}
*{box-sizing:border-box}
a{color:var(--ink)}
a:hover{color:var(--graphite)}
button{font-family:inherit}
section[id]{scroll-margin-top:84px}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.dark :focus-visible{outline-color:var(--sun)}
.display{font-family:var(--font-display)}
.eyebrow{margin:0;font-size:13px;font-weight:500;letter-spacing:.22em;text-transform:uppercase}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;border:1.5px solid transparent;border-radius:2px;font-family:var(--font-body);font-size:16px;font-weight:500;letter-spacing:.06em;line-height:1;text-align:center;text-decoration:none;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease,background-color .25s ease,color .25s ease,border-color .25s ease}
.btn-primary{background:var(--ink);color:var(--white)}
.btn-primary:hover{color:var(--white);transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--sky)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-ghost:hover{background:var(--ink);color:var(--white)}
.btn-light{background:var(--white);color:var(--ink)}
.btn-light:hover{color:var(--ink);transform:translate(-3px,-3px);box-shadow:6px 6px 0 var(--sun)}
.btn-light.is-on{background:var(--sun);color:var(--ink)}
.btn-outline-light{background:transparent;color:var(--white);border-color:var(--pewter)}
.btn-outline-light:hover{background:var(--white);color:var(--ink);border-color:var(--white)}
.textbtn{display:inline-flex;align-items:center;gap:12px;min-height:44px;padding:0 6px;background:none;border:0;color:var(--ink);font-size:14px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
.textbtn::before{content:"";display:block;width:34px;height:1.5px;background:var(--ink);transition:width .3s ease}
.textbtn:hover::before{width:58px}

/* Navigation */
.navlink{position:relative;padding:12px 2px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
.navlink::after{content:"";position:absolute;left:0;right:0;bottom:7px;height:1.5px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
.navlink:hover::after{transform:scaleX(1)}
.pip{display:block;width:12px;height:18px;border:1.5px solid var(--ink);border-radius:6px 6px 0 0;transition:background-color .4s ease}
.pip.is-seen{background:var(--ink)}

/* Hero */
.rise{animation:rise .9s cubic-bezier(.2,.7,.1,1) both}
.rise-2{animation-delay:.1s}
.rise-3{animation-delay:.2s}
.rise-4{animation-delay:.3s}
@keyframes rise{
from{transform:translateY(24px)}
to{transform:none}
}
.stage{--mx:0;--my:0;position:relative;width:100%;height:620px;container-type:inline-size}
.drift-a{transform:translate(calc(var(--mx)*-14px),calc(var(--my)*-9px));transition:transform .5s cubic-bezier(.2,.7,.1,1)}
.drift-b{transform:translate(calc(var(--mx)*20px),calc(var(--my)*12px));transition:transform .5s cubic-bezier(.2,.7,.1,1)}
.drift-c{transform:translate(calc(var(--mx)*-30px),calc(var(--my)*-18px));transition:transform .5s cubic-bezier(.2,.7,.1,1)}
.deco-moon{position:absolute;right:0;top:0;width:200px;height:200px;border-radius:50%;background:var(--stone)}
.deco-squiggle{position:absolute;left:0;top:6px;width:120px;height:24px}
.deco-column{position:absolute;right:9px;bottom:56px;width:42px;height:280px;background:repeating-linear-gradient(90deg,var(--white) 0 7px,var(--stone) 7px 14px);border:1.5px solid var(--ink);border-bottom:0}
.deco-column::before{content:"";position:absolute;left:-9px;right:-9px;top:-14px;height:14px;background:var(--white);border:1.5px solid var(--ink)}
.deco-orb{position:absolute;left:50%;top:-58px;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:var(--sun);border:1.5px solid var(--ink)}
.floor{position:absolute;left:0;right:0;bottom:0;height:56px;border-top:1.5px solid var(--ink);background:conic-gradient(var(--ink) 25%,var(--mist) 0 50%,var(--ink) 0 75%,var(--mist) 0) 0 0/56px 56px}
.arch-frame{position:absolute;left:6%;bottom:56px;width:min(84%,400px);padding:10px 10px 0;background:var(--white);border:1.5px solid var(--ink);border-bottom:0;border-radius:999px 999px 0 0}
.arch{position:relative;height:520px;border-radius:999px 999px 0 0;overflow:hidden;background:var(--mist)}
.vista{position:absolute;inset:0;overflow:hidden;background:var(--mist)}
.vista-sun{position:absolute;left:50%;top:20%;width:150px;height:150px;margin-left:-45px;border-radius:50%;background:var(--sun)}
.vista-arcade{position:absolute;left:9%;bottom:38%;display:flex;align-items:flex-end;gap:6px}
.vista-arcade span{display:block;width:22px;height:38px;border-radius:11px 11px 0 0;background:var(--ink)}
.vista-sea{position:absolute;left:0;right:0;bottom:0;height:38%;background:var(--sky)}
.vista-sea::before{content:"";position:absolute;left:0;right:0;top:-1px;height:20px;background:radial-gradient(circle at 20px 0,var(--mist) 19px,rgba(240,241,239,0) 20px) 0 0/40px 20px repeat-x}
.vista-deep{position:absolute;left:0;right:0;bottom:0;height:21%;background:var(--ink)}
.vista-deep::before{content:"";position:absolute;left:0;right:0;top:-1px;height:20px;background:radial-gradient(circle at 20px 0,var(--sky) 19px,rgba(118,156,210,0) 20px) 20px 0/40px 20px repeat-x}
.vista-link{position:absolute;right:9%;bottom:6%;z-index:1;padding:14px 4px 10px;border-bottom:1.5px solid var(--sun);color:var(--white);font-size:14px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;text-decoration:none}
.vista-link:hover{color:var(--white);border-bottom-width:3px}
.leaf{position:absolute;inset:0;z-index:2;display:block;width:100%;height:100%;margin:0;padding:0;border:0;background:var(--sky);color:var(--ink);cursor:pointer;transform-origin:0 50%;transform:perspective(1500px) rotateY(0deg);transition:transform 1.2s cubic-bezier(.3,.7,.1,1)}
.leaf:hover{transform:perspective(1500px) rotateY(10deg)}
.leaf.is-open{transform:perspective(1500px) rotateY(76deg)}
.leaf.is-open:hover{transform:perspective(1500px) rotateY(70deg)}
.leaf-top{position:absolute;left:13%;right:13%;top:9%;height:36%;border:1.5px solid rgba(0,0,0,.55);border-radius:999px 999px 0 0}
.leaf-mid{position:absolute;left:13%;right:13%;top:49%;height:12%;border:1.5px solid rgba(0,0,0,.55)}
.leaf-low{position:absolute;left:13%;right:13%;top:65%;height:27%;border:1.5px solid rgba(0,0,0,.55)}
.leaf-knob{position:absolute;right:4%;top:53%;width:26px;height:26px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 5px rgba(0,0,0,.25)}
.leaf-word{position:absolute;left:0;right:0;top:52.6%;text-align:center;font-size:13px;font-weight:500;letter-spacing:.34em;text-transform:uppercase}
@container (max-width: 470px){
.deco-column,.deco-moon{display:none}
}

/* Ticker */
.ticker{overflow:hidden;background:var(--ink);color:var(--white);border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.ticker-track{display:flex;width:max-content;animation:slide 60s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-set{display:flex;align-items:center;gap:36px;padding:17px 18px}
.tick{display:flex;align-items:center;gap:36px;font-size:26px;font-style:italic;font-weight:500;line-height:1.3;white-space:nowrap}
.tick-arch{display:block;width:12px;height:18px;border-radius:6px 6px 0 0;background:var(--sun)}
@keyframes slide{
to{transform:translateX(-50%)}
}

/* The house */
.chip{min-height:44px;padding:0 20px;border:1.5px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);font-size:15px;font-weight:500;letter-spacing:.04em;cursor:pointer;transition:background-color .25s ease,color .25s ease}
.chip:hover{background:var(--mist)}
.chip.is-on{background:var(--ink);color:var(--white)}
.door{display:flex;flex-direction:column;align-items:center;gap:0;margin:0;padding:0 0 6px;border:0;background:none;color:var(--ink);font-size:inherit;text-align:center;cursor:pointer;transition:opacity .35s ease}
.door.is-dim{opacity:.26}
.door-arch{position:relative;display:block;width:100%;max-width:168px;aspect-ratio:5/8;border-radius:999px 999px 0 0;overflow:hidden;background:var(--mist);box-shadow:0 0 0 6px var(--white),0 0 0 7.5px var(--ink)}
.door-step{display:block;width:100%;max-width:200px;height:8px;margin-top:7.5px;background:var(--ink)}
.door-leaf{position:absolute;inset:0;display:block;background:var(--sky);transform-origin:0 50%;transform:perspective(900px) rotateY(0deg);transition:transform .9s cubic-bezier(.3,.7,.1,1)}
.door.alt .door-leaf{background:var(--ink)}
.door:hover .door-leaf{transform:perspective(900px) rotateY(16deg)}
.door.is-active .door-leaf{transform:perspective(900px) rotateY(78deg)}
.door-no{position:absolute;left:0;right:0;top:24%;color:var(--ink);font-size:46px;font-style:italic;font-weight:500;line-height:1;text-align:center}
.door.alt .door-no{color:var(--white)}
.door-knob{position:absolute;right:11%;top:58%;width:12px;height:12px;border-radius:50%;background:var(--sun)}
.door-name{display:block;margin-top:18px;font-size:25px;font-weight:500;line-height:1.1}
.door.is-active .door-name{color:var(--ink);font-style:italic}
.door-place{display:block;margin-top:7px;font-size:12px;letter-spacing:.16em;line-height:1.3;text-transform:uppercase;color:var(--graphite)}
.door-badge{display:block;margin-top:10px;padding:4px 10px;border-radius:999px;background:var(--sun);color:var(--ink);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;visibility:hidden}
.door.is-picked .door-badge{visibility:visible}
.scene{position:absolute;inset:0;display:block}
.scene span{position:absolute;display:block}
.s-gallery{background:var(--mist)}
.s-gallery .sa{left:50%;top:22%;width:34%;aspect-ratio:1;border-radius:50%;background:var(--sun);transform:translateX(-50%)}
.s-gallery .sb{left:8%;right:8%;bottom:30%;height:21%;border-radius:999px 999px 0 0;background:var(--stone)}
.s-gallery .sc{left:0;right:0;bottom:0;height:30%;background:var(--sky)}
.s-games{background:var(--ink)}
.s-games .sa{left:50%;top:16%;width:62%;aspect-ratio:1;border:7px solid var(--sky);border-radius:50%;transform:translateX(-50%)}
.s-games .sb{left:0;right:0;bottom:0;height:27%;background:conic-gradient(var(--white) 25%,var(--sky) 0 50%,var(--white) 0 75%,var(--sky) 0) 0 0/28px 28px}
.s-games .sc{left:50%;top:31%;width:20%;aspect-ratio:1;border-radius:50%;background:var(--sun);transform:translateX(-50%)}
.s-spa{background:var(--stone)}
.s-spa .sa{left:50%;bottom:0;width:130%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,var(--sky) 0 5px,var(--lagoon) 5px 13px);transform:translate(-50%,50%)}
.s-spa .sb{left:50%;top:18%;width:26%;aspect-ratio:1;border-radius:50%;background:var(--white);transform:translateX(-50%)}
.s-spa .sc{display:none}
.s-family{background:var(--mist)}
.s-family .sa{left:10%;right:10%;bottom:0;height:74%;border-radius:999px 999px 0 0;background:var(--ink)}
.s-family .sb{left:25%;right:25%;bottom:0;height:53%;border-radius:999px 999px 0 0;background:var(--sky)}
.s-family .sc{left:38%;right:38%;bottom:0;height:31%;border-radius:999px 999px 0 0;background:var(--sun)}
.s-garden{background:var(--mist)}
.s-garden .sa{left:9%;top:24%;width:48%;aspect-ratio:1;border-radius:50%;background:var(--sky)}
.s-garden .sb{right:8%;top:47%;width:34%;aspect-ratio:1;border-radius:50%;background:var(--lagoon)}
.s-garden .sa::after,.s-garden .sb::after{content:"";position:absolute;left:50%;top:94%;width:5px;height:160%;margin-left:-2.5px;background:var(--ink)}
.s-garden .sc{left:0;right:0;bottom:0;height:14%;background:var(--ink)}
.s-deck{background:var(--mist)}
.s-deck .sa{left:50%;bottom:42%;width:66%;aspect-ratio:2/1;border-radius:999px 999px 0 0;background:var(--sun);transform:translateX(-50%)}
.s-deck .sb{left:0;right:0;bottom:22%;height:20%;background:var(--sky)}
.s-deck .sc{left:0;right:0;bottom:0;height:22%;background:repeating-linear-gradient(90deg,var(--white) 0 12px,var(--ink) 12px 24px)}
.panel{animation-duration:.6s;animation-timing-function:cubic-bezier(.2,.7,.1,1);animation-fill-mode:both}
.swap-a{animation-name:swapA}
.swap-b{animation-name:swapB}
@keyframes swapA{
from{opacity:.35;transform:translateY(16px)}
to{opacity:1;transform:none}
}
@keyframes swapB{
from{opacity:.35;transform:translateY(16px)}
to{opacity:1;transform:none}
}
.tag{display:inline-flex;align-items:center;gap:9px;min-height:40px;padding:6px 16px;border:1px solid var(--pewter);border-radius:999px;background:var(--white);color:var(--ink);font-size:16px;line-height:1.2}
.tag-new{padding:3px 8px;border-radius:999px;background:var(--sun);color:var(--ink);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}

/* Registration */
.field{display:flex;flex-direction:column;gap:9px;min-width:0}
.label{font-size:13px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--graphite)}
.input{width:100%;height:56px;padding:0 16px;border:0;border-bottom:1.5px solid var(--ink);border-radius:2px 2px 0 0;background:var(--white);color:var(--ink);font-family:inherit;font-size:18px;transition:background-color .2s ease,border-color .2s ease}
.input:focus{background:var(--white);border-bottom-color:var(--sky)}
.input.is-bad{border-bottom-color:var(--alert);background:var(--alert-wash)}
.err{font-size:15px;color:var(--alert)}
.opt{min-height:48px;padding:0 18px;border:1.5px solid var(--ink);border-radius:2px;background:var(--white);color:var(--ink);font-size:16px;font-weight:500;letter-spacing:.02em;cursor:pointer;transition:background-color .2s ease,color .2s ease}
.opt:hover{background:var(--stone)}
.opt.is-on{background:var(--ink);color:var(--white)}
.count{display:inline-flex;align-items:center;align-self:flex-start;border:1.5px solid var(--ink);border-radius:2px;background:var(--white)}
.count button{width:48px;height:46px;border:0;background:transparent;color:var(--ink);font-size:24px;line-height:1;cursor:pointer}
.count button:hover{background:var(--stone)}
.count span{min-width:48px;text-align:center;font-size:19px;font-weight:500}
.check{display:flex;align-items:flex-start;gap:14px;font-size:16px;line-height:1.5;color:var(--graphite);cursor:pointer}
.check input{flex:none;width:22px;height:22px;margin:1px 0 0;accent-color:var(--ink)}
.keycard{position:relative;display:flex;flex-direction:column;gap:18px;width:100%;max-width:420px;margin:0 auto;padding:118px 36px 36px;border-radius:999px 999px 4px 4px;background:var(--ink);color:var(--white);box-shadow:10px 10px 0 var(--sky);transition:box-shadow .6s ease,transform .6s cubic-bezier(.2,.7,.1,1)}
.keycard.is-cut{box-shadow:10px 10px 0 var(--sun);transform:rotate(-2deg)}
.key-hole{position:absolute;left:50%;top:42px;width:36px;height:36px;margin-left:-18px;border-radius:50%;background:var(--mist);box-shadow:inset 0 0 0 1.5px var(--ink)}
.key-row{display:flex;flex-direction:column;gap:3px;padding-top:14px;border-top:1px dashed var(--pewter)}
.key-k{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--stone)}
.key-v{font-size:17px;line-height:1.35;overflow-wrap:anywhere}

@media (prefers-reduced-motion: reduce){
.ticker-track,.rise,.panel{animation:none}
.leaf,.door-leaf,.drift-a,.drift-b,.drift-c{transition:none}
}
.door-no,.door-knob{transition:opacity .4s ease}
.door.is-active .door-no,.door.is-active .door-knob{opacity:0}
/* Site pages */
.door{text-decoration:none}
.navlink.is-current::after{transform:scaleX(1)}
.btn-primary.is-on{background:var(--sun);color:var(--ink)}
.btn-primary.is-on:hover{color:var(--ink)}
.textlink{display:inline-flex;align-items:center;gap:12px;min-height:44px;font-size:14px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
.textlink::before{content:"";display:block;width:34px;height:1.5px;background:var(--ink);transition:width .3s ease}
.textlink:hover::before{width:58px}
.room-arch{position:relative;width:min(100%,360px);aspect-ratio:5/7;border-radius:999px 999px 0 0;overflow:hidden;background:var(--mist);box-shadow:0 0 0 10px var(--white),0 0 0 11.5px var(--ink)}
.slot{display:flex;align-items:center;justify-content:center;min-height:220px;padding:16px;border:1.5px dashed var(--pewter);background:var(--white);color:var(--graphite);font-size:13px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;text-align:center}
.hop{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:8px;padding:28px 32px;border:1.5px solid var(--ink);background:var(--white);color:var(--ink);text-decoration:none;transition:background-color .25s ease,color .25s ease}
.hop:hover{background:var(--ink);color:var(--white)}
.hop-k{font-size:12px;font-weight:500;letter-spacing:.18em;text-transform:uppercase}
.hop-v{font-size:34px;font-style:italic;font-weight:500;line-height:1.1}
.detail{display:flex;flex-direction:column;gap:8px;margin:0;padding:22px 0 26px;border-top:1.5px solid var(--ink)}
.detail-k{font-size:13px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--graphite)}
.detail-v{margin:0;font-size:30px;font-weight:500;line-height:1.15;overflow-wrap:anywhere}
.visit-step{display:flex;flex-direction:column;gap:12px;padding-top:22px;border-top:1.5px solid var(--pewter)}
.visit-no{font-size:30px;font-style:italic;font-weight:500;line-height:1;color:var(--sun)}
.visit-title{margin:0;font-size:32px;font-weight:500;line-height:1.1}
.visit-body{margin:0;font-size:18px;line-height:1.55;color:var(--stone)}
.footlink{display:inline-flex;align-items:center;min-height:36px;color:var(--stone);text-decoration:none}
.footlink:hover{color:var(--white);text-decoration:underline}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="margin: 0; padding: 24px; background: #FFFFFF; color: #000000; font-family: system-ui, sans-serif">This concept site needs JavaScript to display.</p></noscript>
<template id="dc">
<div style="--sun: {{accent}}">
<div id="top" style="background: var(--mist); color: var(--ink); font-family: var(--font-body); font-size: 18px; line-height: 1.55; overflow-x: clip">

<div style="background: var(--ink); color: var(--stone); padding: 10px 24px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; font-size: 13px; letter-spacing: 0.06em; text-align: center">
<span>Concept for client review</span>
<span aria-hidden="true">/</span>
<span>Organised by {{organiser}}</span>
<span aria-hidden="true">/</span>
<span>Registration runs in preview mode</span>
</div>

<header style="position: sticky; top: 0; z-index: 40; background: var(--mist); border-bottom: 1px solid var(--stone)">
<div style="max-width: 1280px; margin: 0 auto; padding: 12px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 28px">
<a href="#home" style="display: flex; align-items: center; gap: 14px; min-height: 46px; text-decoration: none; color: var(--ink)">
<span aria-hidden="true" style="display: block; width: 22px; height: 32px; border-radius: 11px 11px 0 0; background: var(--ink)"></span>
<span style="display: flex; flex-direction: column; gap: 4px">
<span class="display" style="font-size: 22px; font-weight: 600; line-height: 1; color: var(--ink)">All Doors Open</span>
<span style="font-size: 11px; letter-spacing: 0.18em; line-height: 1; text-transform: uppercase; color: var(--graphite)">An open house of Aldar communities</span>
</span>
</a>
<nav aria-label="Site" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 28px">
<sc-for list="{{ nav }}" as="n"><a class="navlink {{ n.cls }}" href="{{ n.href }}" aria-current="{{ n.current }}">{{ n.label }}</a></sc-for>
<span style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="display: flex; align-items: flex-end; gap: 4px">
<sc-for list="{{ rooms }}" as="room"><span class="pip {{ room.pipCls }}"></span></sc-for>

<span class="leaf-knob" aria-hidden="true"></span>

</div>
</div>
<button type="button" id="hero-door-toggle" class="textbtn" onClick="{{ toggleDoor }}">{{ doorLabel }}</button>
</div>
</div>
</section>

<div class="ticker">

</div>
<div class="ticker-set" aria-hidden="true">
<sc-for list="{{ ticker }}" as="t"><span class="tick"><span>{{ t.n }}</span><span class="tick-arch"></span></span></sc-for>

<section id="house" style="background: var(--white)">

</div>

</span>
<span class="door-step"></span>
<span class="door-name display">{{ room.name }}</span>
<span class="door-place">{{ room.place }}</span>
<span class="door-badge">On your visit</span>
</a>
</sc-for>
</div>
</div>
</section>

<section style="background: var(--stone); color: var(--ink)">
<div style="max-width: 1280px; margin: 0 auto; padding: 72px 32px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 28px 64px">

<div style="display: flex; flex-direction: column; gap: 18px">

</div>
</div>
<div class="field" role="group" aria-labelledby="l-rooms">

</div>
